name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  # Never interrupt a production migration or deployment midway through.
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --watch=false --browsers=ChromeHeadless
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore papermast/papermast.csproj
      - run: dotnet build papermast/papermast.csproj --configuration Release --no-restore

  images:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/grimshawb/papermast-web:${{ github.sha }}
            ghcr.io/grimshawb/papermast-web:production
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: papermast/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/grimshawb/papermast-api:${{ github.sha }}
            ghcr.io/grimshawb/papermast-api:production
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: images
    environment:
      name: production
      url: https://papermast.com
    steps:
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/papermast_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/papermast_deploy ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/papermast_deploy >/dev/null
      - name: Deploy exact commit to production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh \
            -i ~/.ssh/papermast_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            deploy@"$VPS_HOST" \
            "sudo /usr/local/sbin/papermast-deploy '$GITHUB_SHA'"
