name: papermast

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ${PAPERMAST_WEB_IMAGE:-papermast-web:local}
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    mem_limit: 192m
    logging: *default-logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge

  api:
    image: ${PAPERMAST_API_IMAGE:-papermast-api:local}
    build:
      context: .
      dockerfile: papermast/Dockerfile
    restart: unless-stopped
    mem_limit: 640m
    logging: *default-logging
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Server=mysql;Port=3306;Database=papermast;User=papermast;Password=${MYSQL_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Jwt__Issuer: PaperMast
      Jwt__Audience: PaperMast
      Jwt__Key: ${JWT_KEY}
      GoogleBooks__ApiUrl: https://www.googleapis.com/books/v1/volumes
      GoogleBooks__ApiKey: ${GOOGLE_BOOKS_API_KEY}
      OpenLibrary__ApiUrl: https://openlibrary.org/search.json
      OpenLibrary__BooksApiUrl: https://openlibrary.org/api/books
      OpenLibrary__UserAgent: ${OPEN_LIBRARY_USER_AGENT}
      Wiki__RequestHeader: ${WIKI_REQUEST_HEADER}
      Wiki__ApiUrl: https://en.wikipedia.org/api/rest_v1/page/summary
      Nyt__ApiUrl: https://api.nytimes.com/svc/books/v3
      Nyt__Key: ${NYT_KEY}
      Librarian__Enabled: ${LIBRARIAN_ENABLED:-false}
      Librarian__BaseUrl: http://librarian:8091
      Librarian__RequestTimeoutSeconds: ${LIBRARIAN_REQUEST_TIMEOUT_SECONDS:-20}
      Librarian__CacheMinutes: ${LIBRARIAN_CACHE_MINUTES:-60}
      Librarian__CatalogVersion: ${LIBRARIAN_CATALOG_VERSION:-bge-runtime-v1}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - edge
      - data

  librarian:
    profiles: ["librarian"]
    image: ${PAPERMAST_LIBRARIAN_IMAGE:-papermast-librarian:local}
    build:
      context: .
      dockerfile: tools/openlibrary-import/Dockerfile.librarian
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      LIBRARIAN_QDRANT_URL: http://qdrant:6333
      LIBRARIAN_QDRANT_COLLECTION: ${LIBRARIAN_COLLECTION:-papermast_fiction_bge_runtime_v1}
      LIBRARIAN_GEMINI_MODEL: ${LIBRARIAN_GEMINI_MODEL:-gemini-3.5-flash-lite}
      LIBRARIAN_EXPECTED_POINTS: ${LIBRARIAN_EXPECTED_POINTS:-676258}
      LIBRARIAN_MAX_CONCURRENCY: ${LIBRARIAN_MAX_CONCURRENCY:-2}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
    volumes:
      - /opt/papermast/catalog-artifacts:/catalog:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8091/health/ready', timeout=5)
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
    networks:
      - data

  qdrant:
    profiles: ["librarian"]
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
      - /opt/papermast/catalog-artifacts:/catalog:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - data

  migrate:
    image: ${PAPERMAST_API_IMAGE:-papermast-api:local}
    profiles: ["migration"]
    entrypoint: ["/app/efbundle"]
    command: ["--connection", "Server=mysql;Port=3306;Database=papermast;User=papermast;Password=${MYSQL_PASSWORD}"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - data

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 1280m
    logging: *default-logging
    environment:
      MYSQL_DATABASE: papermast
      MYSQL_USER: papermast
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - data

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - data

networks:
  edge:
  data:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
  redis_data:
  qdrant_data:
