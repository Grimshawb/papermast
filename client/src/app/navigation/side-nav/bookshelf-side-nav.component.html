<div class="sidenav-content py-2">

  <nav class="mobile-nav" aria-label="Primary navigation">
    <a mat-button
       class="nav-button"
       [routerLink]="homeNavItem.route"
       routerLinkActive="active-nav-item"
       [routerLinkActiveOptions]="{ exact: true }"
       (click)="navigate()">
      <mat-icon>{{ homeNavItem.icon }}</mat-icon>
      <span>{{ homeNavItem.label }}</span>
    </a>

    <mat-accordion multi>
      @for (group of navigationGroups; track group.label) {
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              <mat-icon>{{ group.icon }}</mat-icon>
              <span>{{ group.label }}</span>
            </mat-panel-title>
          </mat-expansion-panel-header>

          @for (item of group.items; track item.route) {
            <a mat-button
               class="nav-button child-nav-button"
               [routerLink]="item.route"
               routerLinkActive="active-nav-item"
               (click)="navigate()">
              <mat-icon>{{ item.icon }}</mat-icon>
              <span>{{ item.label }}</span>
            </a>
          }
        </mat-expansion-panel>
      }
    </mat-accordion>
  </nav>

  <div class="sidenav-bottom">
    <div class="theme-row">
      <button mat-icon-button
        class="theme-toggle-button"
        type="button"
        (click)="toggleDarkMode()"
        [attr.aria-label]="darkMode ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="darkMode ? 'Switch to light mode' : 'Switch to dark mode'">
        <mat-icon color="accent">{{ darkMode ? 'brightness_7' : 'brightness_2' }}</mat-icon>
      </button>
    </div>
  </div>
</div>
