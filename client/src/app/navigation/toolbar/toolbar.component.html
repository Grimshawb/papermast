<mat-toolbar color="primary" class="toolbar">

  <!-- Left -->
  @if (isMobile) {
    <button mat-icon-button (click)="menuClick()" class="toggle-button" aria-label="Open navigation menu">
      <mat-icon color="accent">menu</mat-icon>
    </button>
  }
  <a [routerLink]="'/'" class="logo-link" aria-label="Paper Mast home">
    <img src="assets/pm-logo-white.svg" class="app-logo" alt="Paper Mast">
  </a>

  @if (!isMobile) {
    <nav class="desktop-nav" aria-label="Primary navigation">
      <a mat-button
         [routerLink]="homeNavItem.route"
         routerLinkActive="active-nav-item"
         [routerLinkActiveOptions]="{ exact: true }">
        {{ homeNavItem.label }}
      </a>

      @for (group of navigationGroups; track group.label) {
        <button mat-button [matMenuTriggerFor]="navMenu">
          {{ group.label }}
          <mat-icon iconPositionEnd>arrow_drop_down</mat-icon>
        </button>
        <mat-menu #navMenu="matMenu">
          @for (item of group.items; track item.route) {
            <a mat-menu-item [routerLink]="item.route" routerLinkActive="active-menu-item">
              <mat-icon>{{ item.icon }}</mat-icon>
              <span>{{ item.label }}</span>
            </a>
          }
        </mat-menu>
      }
    </nav>
  }

  <!-- <span class="app-title">{{ appTitle }}</span> -->
  <span class="spacer"></span>


  <!-- Right -->
  <div>
    @if (!loggedInUser) {
      <button [routerLink]="'login'" mat-flat-button color="accent" (click)="logout()">Log In</button>
    }
    @if (loggedInUser) {
      <!-- <span style="margin-right: 2rem; color: white;">Welcome Back {{loggedInUser.firstName}}</span> -->
      <div class="mat-toolbar-single-row">
        <button class="me-2" mat-flat-button color="accent" (click)="logout()">Log Out</button>
        <button matIconButton color="accent" [matMenuTriggerFor]="menu" aria-label="Open account menu">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item>
            <mat-icon>account_circle</mat-icon>
            <span>Account</span>
          </button>
        </mat-menu>
      </div>
    }
  </div>

</mat-toolbar>
