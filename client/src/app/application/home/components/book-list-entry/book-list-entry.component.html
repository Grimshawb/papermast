@if (book) {
  <article class="book-card"
           role="button"
           tabindex="0"
           (click)="navigateToBook()"
           (keydown.enter)="navigateToBook()"
           (keydown.space)="navigateToBook(); $event.preventDefault()">
    <div class="cover-wrap">
      <img [src]="book.imageLinks?.thumbnail || book.imageLinks?.smallThumbnail || 'assets/book-placeholder.svg'"
           [alt]="'Cover of ' + book.title">
      <span class="view-prompt">View book <span aria-hidden="true">→</span></span>
    </div>
    <div class="book-info">
      <h3>{{ book.title }}</h3>
      <p class="authors">
        {{ book.authors?.length === 1 ? (book.authors?.[0] || 'Unknown author') : ((book.authors?.[0] + ', et al.') || 'Unknown author') }}
      </p>
      <div class="metadata">
        @if (book.publishedDate) { <span>{{ book.publishedDate }}</span> }
        @if (book.pageCount) { <span>{{ book.pageCount }} pages</span> }
      </div>
    </div>
  </article>
}
