@if (author) {
  <article class="author-card">
    <div class="portrait-wrap">
      <img [src]="author.thumbnail?.source || 'assets/book-placeholder.svg'"
           [alt]="'Portrait of ' + author.title">
      <div class="portrait-glow" aria-hidden="true"></div>
    </div>

    <div class="author-copy">
      <p class="eyebrow">Today’s featured author</p>
      <h2>{{ author.title }}</h2>
      <p class="extract">{{ author.extract }}</p>
      <a class="wikipedia-link"
         [href]="mobileView() ? author.content_urls.mobile.page : author.content_urls.desktop.page"
         target="_blank"
         rel="noopener noreferrer">
        Read the full story
        <span aria-hidden="true">↗</span>
      </a>
    </div>
  </article>
}
